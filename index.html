<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel Financeiro 3D Pro</title>
  <!-- Chart.js CDN para gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.65);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.3);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.3);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 75%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 24px;
    }

    /* Efeito 3D Glassmorphism */
    .card-3d {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 
        0 20px 30px -10px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .header {
      text-align: center;
      padding: 8px 0;
    }

    .header h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #60a5fa 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Card de Saldo Principal com Efeito Volumétrico */
    .balance-card {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.9), rgba(29, 78, 216, 0.8));
      border: 1px solid rgba(255, 255, 255, 0.25);
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 
        0 15px 35px -5px rgba(37, 99, 235, 0.4),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }

    .balance-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 60%);
      pointer-events: none;
    }

    .balance-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      opacity: 0.85;
      font-weight: 600;
    }

    .balance-amount {
      font-size: 2.25rem;
      font-weight: 800;
      margin: 10px 0 16px 0;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      letter-spacing: -0.5px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 700;
    }

    .stat-income { color: #34d399; }
    .stat-expense { color: #f87171; }

    /* Gráfico */
    .chart-container {
      position: relative;
      height: 190px;
      width: 100%;
    }

    /* Formulário */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px -4px var(--success-glow);
      transition: all 0.2s ease;
    }

    .btn-submit:active {
      transform: translateY(2px) scale(0.99);
      box-shadow: 0 4px 10px var(--success-glow);
    }

    /* Histórico */
    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .history-list::-webkit-scrollbar {
      width: 4px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-left: 4px solid var(--primary);
      animation: fadeIn 0.3s ease;
    }

    .history-item.income { border-left-color: var(--success); }
    .history-item.expense { border-left-color: var(--danger); }

    .item-info {
      display: flex;
      flex-direction: column;
    }

    .item-title {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .item-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .item-amount {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      margin-left: 8px;
      padding: 4px;
      line-height: 1;
    }

    .btn-delete:hover {
      color: var(--danger);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <div class="header">
    <h1>Painel Financeiro</h1>
  </div>

  <!-- Card Principal de Saldo -->
  <div class="card-3d balance-card">
    <div class="balance-label">Saldo Total</div>
    <div class="balance-amount" id="totalBalance">R$ 0,00</div>
    <div class="stats-grid">
      <div class="stat-item">
        <span class="balance-label">Entradas</span>
        <span class="stat-value stat-income" id="totalIncome">R$ 0,00</span>
      </div>
      <div class="stat-item">
        <span class="balance-label">Saídas</span>
        <span class="stat-value stat-expense" id="totalExpense">R$ 0,00</span>
      </div>
    </div>
  </div>

  <!-- Gráfico -->
  <div class="card-3d">
    <div class="chart-container">
      <canvas id="financeChart"></canvas>
    </div>
  </div>

  <!-- Formulário -->
  <div class="card-3d">
    <form id="transactionForm" class="form-group">
      <input type="text" id="desc" placeholder="Descrição (ex: Mercado, Pix)" required autocomplete="off">
      <div class="input-row">
        <input type="number" id="amount" placeholder="Valor (R$)" step="0.01" min="0.01" required>
        <select id="type">
          <option value="income">Entrada (+)</option>
          <option value="expense">Saída (-)</option>
        </select>
      </div>
      <button type="submit" class="btn-submit">Adicionar Transação</button>
    </form>
  </div>

  <!-- Histórico -->
  <div class="card-3d">
    <div class="section-title">Lançamentos Recentes</div>
    <ul class="history-list" id="historyList"></ul>
  </div>

</div>

<script>
  // Inicialização do banco local ou dados iniciais de demonstração
  let transactions = JSON.parse(localStorage.getItem('app_finances_3d')) || [
    { id: 1, desc: 'Salário', amount: 4500, type: 'income', date: '01/10' },
    { id: 2, desc: 'Aluguel', amount: 1500, type: 'expense', date: '02/10' },
    { id: 3, desc: 'Supermercado', amount: 620.50, type: 'expense', date: '04/10' }
  ];

  let chart;

  function initChart() {
    const ctx = document.getElementById('financeChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Entradas', 'Saídas'],
        datasets: [{
          data: [0, 0],
          backgroundColor: ['#10b981', '#ef4444'],
          borderColor: '#161e31',
          borderWidth: 4,
          hoverOffset: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { 
              color: '#f8fafc', 
              font: { size: 12, weight: '600' },
              padding: 16
            }
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                let value = context.raw || 0;
                return ' ' + context.label + ': R$ ' + value.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
              }
            }
          }
        },
        cutout: '72%'
      }
    });
  }

  function formatCurrency(value) {
    return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function deleteTransaction(id) {
    transactions = transactions.filter(t => t.id !== id);
    updateApp();
  }

  function updateApp() {
    const income = transactions
      .filter(t => t.type === 'income')
      .reduce((acc, t) => acc + t.amount, 0);

    const expense = transactions
      .filter(t => t.type === 'expense')
      .reduce((acc, t) => acc + t.amount, 0);

    const total = income - expense;

    // Atualiza Valores no Card Principal
    document.getElementById('totalBalance').innerText = formatCurrency(total);
    document.getElementById('totalIncome').innerText = formatCurrency(income);
    document.getElementById('totalExpense').innerText = formatCurrency(expense);

    // Atualiza Gráfico
    chart.data.datasets[0].data = [income, expense];
    chart.update();

    // Atualiza Histórico
    const historyList = document.getElementById('historyList');
    historyList.innerHTML = '';

    if (transactions.length === 0) {
      historyList.innerHTML = '<li style="text-align:center; color: var(--text-muted); font-size:0.85rem; padding: 12px;">Nenhuma transação registrada.</li>';
    } else {
      transactions.slice().reverse().forEach(t => {
        const li = document.createElement('li');
        li.className = `history-item ${t.type}`;
        li.innerHTML = `
          <div class="item-info">
            <span class="item-title">${t.desc}</span>
            <span class="item-date">${t.date || 'Hoje'}</span>
          </div>
          <div style="display: flex; align-items: center;">
            <span class="item-amount" style="color: ${t.type === 'expense' ? 'var(--danger)' : 'var(--success)'}">
              ${t.type === 'expense' ? '-' : '+'} ${formatCurrency(t.amount)}
            </span>
            <button class="btn-delete" onclick="deleteTransaction(${t.id})">&times;</button>
          </div>
        `;
        historyList.appendChild(li);
      });
    }

    // Persiste no Navegador
    localStorage.setItem('app_finances_3d', JSON.stringify(transactions));
  }

  // Evento de Envio do Formulário
  document.getElementById('transactionForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const descInput = document.getElementById('desc');
    const amountInput = document.getElementById('amount');
    const typeInput = document.getElementById('type');

    const desc = descInput.value.trim();
    const amount = parseFloat(amountInput.value);
    const type = typeInput.value;

    if (!desc || isNaN(amount) || amount <= 0) return;

    const today = new Date();
    const dateFormatted = `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}`;

    transactions.push({
      id: Date.now(),
      desc,
      amount,
      type,
      date: dateFormatted
    });

    updateApp();

    descInput.value = '';
    amountInput.value = '';
    descInput.focus();
  });

  // Inicialização da Aplicação
  initChart();
  updateApp();
</script>

</body>
</html>
